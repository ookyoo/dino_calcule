<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dino Calcule</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #7cc35a; font-family: Arial, Helvetica, sans-serif; color: #1f3a12;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #app { position: absolute; left: 0; top: 0; width: 1000px; height: 560px; overflow: hidden;
    background: #bfe6ff;
    background: -webkit-linear-gradient(top, #bfe6ff 0%, #e6f7ff 40%, #9ad47a 40%, #6fb44c 100%);
    background: linear-gradient(to bottom, #bfe6ff 0%, #e6f7ff 40%, #9ad47a 40%, #6fb44c 100%);
    -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .ecran { position: absolute; left: 0; top: 0; width: 1000px; height: 560px; display: none; }
  button { font-family: Arial, Helvetica, sans-serif; border: 0; cursor: pointer; outline: none; }
  .gros { font-size: 30px; font-weight: bold; padding: 14px 30px; border-radius: 16px;
    background: #4a9d2b; color: #fff; border-bottom: 6px solid #2f6d18; }
  .gros:active { border-bottom-width: 2px; margin-top: 4px; }

  /* Accueil */
  #accueil h1 { margin: 6px 0 0; text-align: center; font-size: 42px; color: #1f5a0e;
    text-shadow: 3px 3px 0 #fff; }
  #accueil .soustitre { text-align: center; font-size: 22px; margin: 0 0 4px; height: 28px; }
  .cartes { text-align: center; }
  .carte { display: inline-block; vertical-align: top; width: 172px; margin: 3px 4px; padding: 2px 0 4px;
    background: #fff; border-radius: 16px; border: 4px solid #fff; text-align: center; }
  .carte.choisi { border-color: #f2b705; background: #fff7d1; }
  .carte.verrou { background: #e6e6da; border-color: #e6e6da; color: #777; }
  .carte .nom { font-size: 20px; font-weight: bold; }
  .carte .esp { font-size: 14px; }
  .carte canvas { width: 128px; height: 96px; }
  .options { text-align: center; margin-top: 8px; font-size: 20px; }
  .options .groupe { display: inline-block; margin: 0 6px; vertical-align: middle; }
  #infoNiveau { position: absolute; left: 24px; top: 482px; width: 640px; font-size: 20px; text-align: left; line-height: 28px; }
  #infoNiveau .monte { color: #b35c00; font-weight: bold; }
  .opt { font-size: 20px; font-weight: bold; padding: 9px 9px; margin: 0 1px; border-radius: 12px;
    background: #fff; color: #2f6d18; border: 3px solid #fff; }
  .opt.choisi { background: #f2b705; color: #3b2a00; border-color: #c99600; }
  #btnJouer { position: absolute; left: 700px; top: 478px; width: 270px; }
  #victoires { position: absolute; right: 12px; top: 10px; font-size: 18px; background: #fff;
    padding: 5px 10px; border-radius: 12px; text-align: right; }
  #consigne2j { position: absolute; left: 0; width: 1000px; top: 12px; text-align: center; font-size: 34px;
    font-weight: bold; color: #1f5a0e; text-shadow: 2px 2px 0 #fff; display: none; }

  /* Combat */
  .cote { position: absolute; top: 6px; width: 330px; text-align: center; }
  #coteG { left: 10px; } #coteD { right: 10px; }
  .etiquette { font-size: 24px; font-weight: bold; }
  .barre { position: relative; height: 30px; margin: 4px 15px 0; background: #fff; border-radius: 15px;
    border: 3px solid #1f3a12; overflow: hidden; }
  .barre .vie { position: absolute; left: 0; top: 0; bottom: 0; background: #3cc23c;
    -webkit-transition: width 0.8s; transition: width 0.8s; }
  .barre .txt { position: absolute; left: 0; right: 0; top: 2px; font-size: 21px; font-weight: bold; }
  .combattant { position: relative; width: 240px; height: 180px; margin: 0 auto;
    -webkit-transition: -webkit-transform 0.25s; transition: transform 0.25s; }
  .combattant canvas { width: 240px; height: 180px; }
  .actif .etiquette { color: #b35c00; }
  .degat { position: absolute; left: 70px; top: 20px; font-size: 54px; font-weight: bold; color: #e01b1b;
    text-shadow: 2px 2px 0 #fff; display: none; }
  .degat.soin { color: #1c9a1c; }
  #bulle { position: absolute; left: 350px; top: 20px; width: 300px; min-height: 120px; background: #fff;
    border-radius: 20px; border: 4px solid #1f3a12; padding: 12px; font-size: 24px; text-align: center;
    box-sizing: border-box; -webkit-box-sizing: border-box; }
  #bulle b { color: #b35c00; }
  #panneau { position: absolute; left: 10px; right: 10px; top: 244px; height: 306px; background: #fffbe8;
    border-radius: 22px; border: 4px solid #1f3a12; }

  /* Choix des attaques */
  #attaques .titre { font-size: 28px; font-weight: bold; text-align: center; margin: 12px 0 10px; }
  #grilleAtt { display: inline-block; width: 760px; vertical-align: top; }
  .att { display: inline-block; width: 360px; height: 104px; margin: 6px 10px; border-radius: 18px;
    background: #4a9d2b; color: #fff; font-size: 30px; font-weight: bold; border-bottom: 7px solid #2f6d18;
    vertical-align: top; }
  .att .pts { display: block; font-size: 24px; color: #fff6b0; margin-top: 4px; }
  .att.super { background: #d9480f; border-bottom-color: #8a2c06; }
  .att.potion { width: 180px; height: 222px; background: #9b3fc4; border-bottom-color: #5e1f7d; font-size: 28px; }
  .att.potion canvas { display: block; width: 80px; height: 100px; margin: 0 auto 4px; }
  .att.utilise { background: #aaa; border-bottom-color: #777; color: #eee; }
  .att:active { border-bottom-width: 2px; margin-top: 11px; }

  /* Calcul */
  #calcul { display: none; }
  #onglets { position: absolute; left: 14px; top: 10px; }
  .onglet { font-size: 22px; font-weight: bold; padding: 10px 16px; border-radius: 12px; margin-right: 6px;
    background: #e3e3d0; color: #555; }
  .onglet.choisi { background: #2b7bd9; color: #fff; }
  #zoneCalcul { position: absolute; left: 14px; top: 60px; width: 580px; height: 200px; }
  #direct { text-align: center; padding-top: 18px; }
  #direct .operation { font-size: 58px; font-weight: bold; }
  #reponseDirecte { display: inline-block; min-width: 150px; height: 72px; line-height: 72px; padding: 0 12px;
    border: 4px solid #2b7bd9; border-radius: 14px; background: #fff; vertical-align: middle; color: #2b7bd9; }
  #pose { display: none; padding-left: 150px; }
  .ligne { height: 48px; white-space: nowrap; }
  .ligne.ret { height: 22px; }
  .case { display: inline-block; width: 58px; height: 48px; line-height: 48px; margin: 0 3px; text-align: center;
    font-size: 42px; font-weight: bold; vertical-align: top; }
  .signe { color: #1f3a12; }
  .ret .case { height: 22px; line-height: 22px; }
  .petite { display: inline-block; width: 34px; height: 22px; line-height: 20px; font-size: 20px;
    border: 2px dashed #b9b59a; border-radius: 6px; color: #d9480f; font-weight: bold; box-sizing: border-box;
    -webkit-box-sizing: border-box; }
  .petite.pleine { border-style: solid; border-color: #d9480f; background: #fff1e6; }
  .trait { height: 0; border-top: 5px solid #1f3a12; margin: 2px 0 4px 0; }
  .rep { background: #fff; border: 4px solid #b9b59a; border-radius: 10px; color: #2b7bd9;
    box-sizing: border-box; -webkit-box-sizing: border-box; line-height: 40px; }
  .rep.sel { border-color: #2b7bd9; background: #e3f0ff; }
  .rep.faux { border-color: #e01b1b; background: #ffe3e3; color: #e01b1b; }
  #pave { position: absolute; right: 12px; top: 8px; width: 330px; }
  .touche { display: inline-block; width: 100px; height: 66px; margin: 3px; border-radius: 14px; font-size: 36px;
    font-weight: bold; background: #fff; color: #1f3a12; border: 3px solid #1f3a12; border-bottom-width: 7px;
    vertical-align: top; }
  .touche:active { border-bottom-width: 3px; margin-top: 7px; }
  .touche.eff { background: #ffd9b3; font-size: 24px; }
  .touche.ok { background: #4a9d2b; color: #fff; font-size: 26px; }
  #aide { position: absolute; left: 14px; bottom: 8px; width: 580px; font-size: 22px; text-align: center;
    font-weight: bold; min-height: 28px; }

  /* Fin */
  #fin { text-align: center; }
  #fin h2 { font-size: 56px; margin: 14px 0 0; color: #b35c00; text-shadow: 3px 3px 0 #fff; }
  #fin canvas { width: 280px; height: 210px; }
  #fin p { font-size: 28px; margin: 4px 0 10px; }
  #fin #bonusFin { font-size: 26px; color: #6b1f8a; font-weight: bold; }
  .etoile { position: absolute; font-size: 40px; color: #f2b705; }
  .petitBtn { position: absolute; left: 12px; top: 10px; font-size: 20px; font-weight: bold; padding: 8px 14px;
    border-radius: 12px; background: #fff; color: #2f6d18; border-bottom: 4px solid #9ab98a; }
  .petitBtn:active { border-bottom-width: 1px; margin-top: 3px; }
  .gros.bleu { background: #2b7bd9; border-bottom-color: #164f94; }
  .gros.gris { background: #8c8c7a; border-bottom-color: #5c5c4c; }

  /* Menu */
  #menu h1 { margin: 22px 0 6px; text-align: center; font-size: 56px; color: #1f5a0e; text-shadow: 3px 3px 0 #fff; }
  #menu .soustitre { text-align: center; font-size: 26px; margin: 0 0 18px; }
  .jeu { display: inline-block; vertical-align: top; width: 400px; height: 360px; margin: 0 20px; border-radius: 24px;
    background: #fff; border: 5px solid #1f3a12; border-bottom-width: 11px; text-align: center; color: #1f3a12; }
  .jeu:active { border-bottom-width: 5px; margin-top: 6px; }
  .jeu canvas { width: 360px; height: 180px; margin-top: 10px; }
  .jeu .nom { font-size: 36px; font-weight: bold; color: #b35c00; }
  .jeu .desc { font-size: 21px; margin: 6px 20px 0; }

  /* Calcul chrono : réglages */
  #chronoReglages h1 { margin: 16px 0 6px; text-align: center; font-size: 44px; color: #1f5a0e; text-shadow: 3px 3px 0 #fff; }
  #chronoReglages .intro { text-align: center; font-size: 24px; margin: 0 0 26px; }
  .ligneReg { text-align: center; font-size: 24px; margin: 0 0 20px; }
  .ligneReg .lib { display: inline-block; width: 130px; text-align: right; margin-right: 8px; font-weight: bold; }
  .ligneReg .opt { font-size: 22px; padding: 10px 14px; }
  #infoChrono { text-align: center; font-size: 22px; line-height: 32px; margin-top: 10px; }
  #infoChrono b { color: #b35c00; }
  #btnPartir { position: absolute; left: 365px; top: 466px; width: 270px; }

  /* Calcul chrono : la fiche */
  #piste { position: absolute; left: 0; top: 0; width: 1000px; height: 120px; }
  #sol { position: absolute; left: 0; right: 0; top: 100px; height: 20px; background: #8ccb68; border-top: 6px solid #8a5a2b; }
  #chasseur { position: absolute; left: 0; top: 14px; width: 120px; height: 90px; }
  #chasseur canvas { width: 120px; height: 90px; }
  #oeuf { position: absolute; left: 880px; top: 42px; width: 48px; height: 60px; }
  #oeuf canvas { width: 48px; height: 60px; }
  #compteur { position: absolute; left: 200px; top: 8px; width: 600px; text-align: center; font-size: 24px; font-weight: bold;
    color: #1f5a0e; text-shadow: 2px 2px 0 #fff; }
  #panneauChrono { position: absolute; left: 6px; right: 6px; top: 120px; height: 432px; background: #fffbe8;
    border-radius: 18px; border: 4px solid #1f3a12; }
  .fiche { position: absolute; left: 0; top: 0; width: 640px; height: 432px; }
  .item { position: absolute; width: 310px; height: 46px; line-height: 46px; font-size: 28px; font-weight: bold; white-space: nowrap; }
  .item .num { display: inline-block; width: 36px; text-align: right; margin-right: 4px; font-size: 18px; color: #8c8c7a; }
  .item .calc { display: inline-block; width: 166px; text-align: right; }
  .boite { display: inline-block; width: 86px; height: 40px; line-height: 36px; margin-left: 6px; text-align: center;
    background: #fff; border: 3px solid #b9b59a; border-radius: 8px; color: #2b7bd9; vertical-align: middle;
    box-sizing: border-box; -webkit-box-sizing: border-box; }
  .item.sel .boite { border-color: #2b7bd9; background: #e3f0ff; border-width: 4px; }
  .boite.juste { border-color: #1c9a1c; background: #dff5df; color: #1c7a1c; }
  .boite.faux { border-color: #e01b1b; background: #ffe3e3; color: #e01b1b; text-decoration: line-through; }
  .boite.vide { border-color: #e01b1b; background: #ffe3e3; }
  .item .corr { display: inline-block; margin-left: 6px; font-size: 24px; color: #1c7a1c; }
  #colDroite { position: absolute; left: 646px; top: 8px; width: 330px; text-align: center; }
  #temps { font-size: 36px; font-weight: bold; height: 46px; line-height: 46px; margin: 0 3px 4px;
    background: #fff; border-radius: 12px; border: 3px solid #1f3a12; }
  #temps.urgent { color: #e01b1b; border-color: #e01b1b; }
  #paveChrono .touche { height: 58px; font-size: 32px; }
  #paveChrono .touche.eff, #paveChrono .touche.ok { font-size: 22px; }
  #btnFini { width: 318px; margin-top: 6px; font-size: 28px; padding: 9px 0; background: #d9480f; border-bottom-color: #8a2c06; }
  #btnStop { left: auto; right: 12px; top: 4px; font-size: 18px; padding: 6px 12px; background: #ffe3e3; color: #a01313; border-bottom-color: #d9a0a0; }

  /* Calcul chrono : correction */
  #chronoFin h2 { position: absolute; left: 0; top: 4px; width: 1000px; text-align: center; font-size: 40px; margin: 0;
    color: #b35c00; text-shadow: 3px 3px 0 #fff; }
  #sousTitreFin { position: absolute; left: 0; top: 54px; width: 1000px; text-align: center; font-size: 24px; }
  #ficheFin { position: absolute; left: 6px; top: 112px; width: 640px; height: 432px; background: #fffbe8;
    border-radius: 18px; border: 4px solid #1f3a12; }
  #ficheFin .fiche { width: 640px; }
  #ficheFin .item { font-size: 24px; }
  #ficheFin .item .num { width: 30px; font-size: 16px; }
  #ficheFin .item .calc { width: 140px; }
  #ficheFin .boite { width: 70px; margin-left: 4px; }
  #ficheFin .item .corr { font-size: 22px; margin-left: 4px; }
  #bilanFin { position: absolute; left: 662px; top: 112px; width: 330px; text-align: center; }
  #scoreFin { font-size: 64px; font-weight: bold; color: #1f5a0e; background: #fff; border-radius: 18px; border: 4px solid #1f3a12; }
  #scoreFin small { font-size: 28px; }
  #etoilesFin { font-size: 52px; color: #f2b705; text-shadow: 2px 2px 0 #9a6b00; height: 60px; line-height: 60px; }
  #texteChronoFin { font-size: 22px; margin: 0 0 4px; }
  #recordFin { font-size: 22px; color: #6b1f8a; font-weight: bold; margin: 0 0 8px; min-height: 26px; }
  #bilanFin .gros { width: 320px; font-size: 26px; padding: 8px 0; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== Menu : choix du jeu ===== -->
  <div id="menu" class="ecran">
    <h1>Dino Calcule</h1>
    <div class="soustitre">À quoi veux-tu jouer ?</div>
    <div style="text-align:center">
      <button class="jeu" id="jeuCombat"><canvas id="canMenuCombat" width="720" height="360"></canvas>
        <div class="nom">Combat de dinos</div><div class="desc">Calcule les points de vie pour gagner le combat !</div></button><button
        class="jeu" id="jeuChrono"><canvas id="canMenuChrono" width="720" height="360"></canvas>
        <div class="nom">Calcul chrono</div><div class="desc">15 calculs en 3 minutes, comme à l'école !</div></button>
    </div>
  </div>

  <!-- ===== Calcul chrono : réglages ===== -->
  <div id="chronoReglages" class="ecran">
    <button class="petitBtn" id="regMenu">&#9664; Menu</button>
    <h1>Calcul chrono</h1>
    <div class="intro">Comme à l'école : 15 additions et soustractions sur une fiche.<br>Finis-les avant que le dino attrape l'œuf !</div>
    <div class="ligneReg"><span class="lib">Niveau :</span><button class="opt" data-cniv="0">Débutant</button><button class="opt" data-cniv="1">Facile</button><button class="opt" data-cniv="2">Moyen</button><button class="opt" data-cniv="3">Difficile</button><button class="opt" data-cniv="4">Expert</button></div>
    <div class="ligneReg"><span class="lib">Temps :</span><button class="opt" data-ctps="300">5 min</button><button class="opt" data-ctps="240">4 min</button><button class="opt" data-ctps="180">3 min (examen)</button><button class="opt" data-ctps="120">2 min</button></div>
    <div id="infoChrono"></div>
    <button class="gros" id="btnPartir">Partir !</button>
  </div>

  <!-- ===== Calcul chrono : la fiche ===== -->
  <div id="chrono" class="ecran">
    <div id="piste">
      <div id="sol"></div>
      <div id="compteur"></div>
      <button class="petitBtn" id="btnStop">Arrêter</button>
      <div id="chasseur"><canvas id="canChasseur" width="240" height="180"></canvas></div>
      <div id="oeuf"><canvas id="canOeuf" width="96" height="120"></canvas></div>
    </div>
    <div id="panneauChrono">
      <div class="fiche" id="fiche"></div>
      <div id="colDroite">
        <div id="temps"></div>
        <div id="paveChrono"></div>
        <button class="gros" id="btnFini">J'ai fini !</button>
      </div>
    </div>
  </div>

  <!-- ===== Calcul chrono : correction ===== -->
  <div id="chronoFin" class="ecran">
    <h2 id="titreChronoFin"></h2>
    <div id="sousTitreFin"></div>
    <div id="ficheFin"><div class="fiche" id="ficheCorrigee"></div></div>
    <div id="bilanFin">
      <div id="scoreFin"></div>
      <div id="etoilesFin"></div>
      <p id="texteChronoFin"></p>
      <p id="recordFin"></p>
      <button class="gros" id="btnChronoRejouer">Nouvelle fiche</button>
      <button class="gros bleu" id="btnChronoReglages">Réglages</button>
      <button class="gros gris" id="btnChronoMenu">Menu</button>
    </div>
  </div>

  <!-- ===== Accueil ===== -->
  <div id="accueil" class="ecran">
    <button class="petitBtn" id="accMenu">&#9664; Menu</button>
    <div id="victoires"></div>
    <h1>Dino Calcule</h1>
    <div class="soustitre" id="soustitre">Choisis ton dinosaure !</div>
    <div class="cartes" id="cartes"></div>
    <div class="options">
      <div class="groupe">Joueurs :
        <button class="opt" data-joueurs="1">1 joueur</button><button class="opt" data-joueurs="2">2 joueurs</button>
      </div>
      <div class="groupe">Niveau :
        <button class="opt" data-niv="0">Débutant</button><button class="opt" data-niv="1">Facile</button><button class="opt" data-niv="2">Moyen</button><button class="opt" data-niv="3">Difficile</button><button class="opt" data-niv="4">Expert</button>
      </div>
      <div id="infoNiveau"></div>
    </div>
    <button class="gros" id="btnJouer">Combattre !</button>
  </div>

  <!-- ===== Combat ===== -->
  <div id="combat" class="ecran">
    <div class="cote" id="coteG">
      <div class="etiquette" id="nomG"></div>
      <div class="barre"><div class="vie" id="vieG"></div><div class="txt" id="pvG"></div></div>
      <div class="combattant" id="dinoG"><canvas id="canG" width="480" height="360"></canvas><div class="degat" id="degatG"></div></div>
    </div>
    <div id="bulle"></div>
    <div class="cote" id="coteD">
      <div class="etiquette" id="nomD"></div>
      <div class="barre"><div class="vie" id="vieD"></div><div class="txt" id="pvD"></div></div>
      <div class="combattant" id="dinoD"><canvas id="canD" width="480" height="360"></canvas><div class="degat" id="degatD"></div></div>
    </div>

    <div id="panneau">
      <div id="attaques">
        <div class="titre" id="titreAttaques"></div>
        <div id="listeAttaques" style="text-align:center"></div>
      </div>
      <div id="calcul">
        <div id="onglets">
          <button class="onglet" id="ongletPose">Poser la soustraction</button><button class="onglet" id="ongletDirect">Réponse directe</button>
        </div>
        <div id="zoneCalcul">
          <div id="pose"></div>
          <div id="direct"><div class="operation"><span id="opDirecte"></span> = <span id="reponseDirecte"></span></div></div>
        </div>
        <div id="pave"></div>
        <div id="aide"></div>
      </div>
    </div>
  </div>

  <!-- ===== Fin ===== -->
  <div id="fin" class="ecran">
    <h2 id="titreFin"></h2>
    <canvas id="canFin" width="640" height="480"></canvas>
    <p id="texteFin"></p>
    <p id="bonusFin"></p>
    <button class="gros" id="btnRejouer">Rejouer</button> <button class="gros gris" id="btnFinMenu">Menu</button>
  </div>
</div>

<script>
/* Dino Calcule — JavaScript volontairement "ancien" (ES5) pour le navigateur de la Storio. */

var DINOS = [
  { id: 'rex', nom: 'Rex', espece: 'le T-Rex', couleur: '#5fae3a', fonce: '#2f6d18', ventre: '#c9e8a0',

/* ---------- Son (facultatif) ---------- */
var audio = null;
function son(freqs, duree) {
  try {
    if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audio = new AC(); }
    var t = audio.currentTime;
    for (var i = 0; i < freqs.length; i++) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freqs[i]; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      o.start(t + i * duree); o.stop(t + (i + 1) * duree);
    }
  } catch (e) {}
}

/* ---------- État du jeu ---------- */
var NIVEAUX = [
  { nom: 'Débutant', pv: 99, info: 'Débutant : 99 PV, sans retenue (comme 87 − 25)' },
  { nom: 'Facile', pv: 100, info: 'Facile : 100 PV, des attaques rondes (10, 25, 45...)' },
  { nom: 'Moyen', pv: 150, info: 'Moyen : 150 PV, avec des retenues (comme 150 − 45)' },
  { nom: 'Difficile', pv: 500, info: 'Difficile : 500 PV, des attaques à 3 chiffres (comme 500 − 137)' },
  { nom: 'Expert', pv: 1000, info: 'Expert : 1000 PV, des attaques encore plus fortes (comme 1000 − 278)' }
];
var POUR_MONTER = 3;   // victoires contre l'ordi pour passer au niveau suivant
var POTIONS = 2;       // potions de soin par combat

function nivDepart() {
  var n = lire('niv');
  if (n !== null) return parseInt(n, 10) || 0;
  var ancien = lire('niveau');   // ancienne version du jeu (sans le niveau Débutant)
  return ancien !== null ? (parseInt(ancien, 10) || 0) + 1 : 0;
}
var reglages = { joueurs: lire('joueurs') === '2' ? 2 : 1, niv: nivDepart() };
if (!NIVEAUX[reglages.niv]) reglages.niv = 0;

function hasard(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function chiffres(n) { return String(n).split(''); }

/* Garde v chiffre par chiffre en dessous de ceux de pv : "pv − v" se calcule sans retenue. */
function sansRetenue(v, pv) {
  var a = chiffres(pv), b = chiffres(v), r = '';
  if (b.length > a.length) b = b.slice(b.length - a.length);
  while (b.length < a.length) b.unshift('0');
  for (var i = 0; i < a.length; i++) r += Math.min(parseInt(a[i], 10), parseInt(b[i], 10));
  return parseInt(r, 10) || pv;
}

/* Points d'une attaque selon le niveau (tirés à chaque tour, sauf au niveau Moyen). */
function degats(base, cible) {
  if (reglages.niv === 0) return sansRetenue(base + hasard(-3, 3), cible.pv);
  if (reglages.niv === 1) return Math.max(5, Math.round(base / 5) * 5);
  if (reglages.niv === 3) return base * 3 + hasard(-9, 9);
  if (reglages.niv === 4) return base * 6 + hasard(-19, 19);
  return base;
}

/* PV rendus par une potion (jamais plus que la vie perdue). */
function soin(a) {
  var manque = a.max - a.pv, v;
  if (manque <= 0) return 0;
  if (reglages.niv === 0) {
    // addition sans retenue : chaque chiffre de pv + soin reste sous 10
    var p = chiffres(a.pv), w;
    while (p.length < 2) p.unshift('0');
    do { w = hasard(12, 35); } while (w % 10 === 0);
    v = Math.min(Math.floor(w / 10), 9 - parseInt(p[0], 10)) * 10 + Math.min(w % 10, 9 - parseInt(p[1], 10));
  } else if (reglages.niv === 1) v = hasard(3, 6) * 5;
  else if (reglages.niv === 2) v = hasard(18, 35);
  else if (reglages.niv === 3) v = hasard(60, 110);
  else v = hasard(120, 220);
  return Math.min(v, manque);
}

/* ---------- Collection ---------- */
function collection() { var c = lire('collection'); return c ? c.split(',') : []; }
function debloque(i) { return i < NB_DEPART || collection().indexOf(DINOS[i].id) >= 0; }
function nbDebloques() { var n = 0; for (var i = 0; i < DINOS.length; i++) if (debloque(i)) n++; return n; }
/* Après une victoire : on gagne le dino battu s'il était caché, sinon le prochain de la liste. */
function gagnerDino(battu) {
  var n = -1;
  if (!debloque(battu)) n = battu;
  else for (var i = 0; i < DINOS.length; i++) if (!debloque(i)) { n = i; break; }
  if (n < 0) return null;
  var col = collection(); col.push(DINOS[n].id);
  stocker('collection', col.join(','));
  return DINOS[n];
}
function gagnesNiveau(n) { return parseInt(lire('gagnes-' + n) || '0', 10); }
var choix = [0, null];   // dinos choisis (joueur 1, joueur 2)
var etapeChoix = 0;      // en mode 2 joueurs : 0 = joueur 1 choisit, 1 = joueur 2
var j = [];              // combattants
var tour = 0;            // index du combattant qui attaque
var occupe = false;
var modeCalcul = lire('mode') === 'direct' ? 'direct' : 'pose';
var q = null;            // question en cours

function afficher(id) {
  var e = ['menu', 'accueil', 'combat', 'fin', 'chronoReglages', 'chrono', 'chronoFin'];
  for (var i = 0; i < e.length; i++) $(e[i]).style.display = e[i] === id ? 'block' : 'none';
}

/* ---------- Accueil ---------- */
function construireAccueil() {
  var h = '';
  for (var i = 0; i < DINOS.length; i++) {
    h += '<div class="carte" data-i="' + i + '"><canvas width="256" height="192" id="carte' + i + '"></canvas>' +
         '<div class="nom" id="nomCarte' + i + '"></div><div class="esp" id="espCarte' + i + '"></div></div>';
  }
  $('cartes').innerHTML = h;
  for (var k = 0; k < DINOS.length; k++) {
    $('carte' + k).parentNode.onclick = (function (n) { return function () { choisirDino(n); }; })(k);
  }
  dessinerCartes();
  var opts = $('accueil').querySelectorAll('.opt');
  for (var o = 0; o < opts.length; o++) {
    opts[o].onclick = function () {
      if (this.getAttribute('data-joueurs')) { reglages.joueurs = parseInt(this.getAttribute('data-joueurs'), 10); stocker('joueurs', reglages.joueurs); }
      if (this.getAttribute('data-niv')) { reglages.niv = parseInt(this.getAttribute('data-niv'), 10); stocker('niv', reglages.niv); }
      etapeChoix = 0;
      majAccueil();
    };
  }
  $('btnJouer').onclick = jouer;
}

function dessinerCartes() {
  for (var k = 0; k < DINOS.length; k++) {
    var ok = debloque(k);
    dessinerDino($('carte' + k), DINOS[k], false, false, !ok);
    $('nomCarte' + k).innerHTML = ok ? DINOS[k].nom : '???';
    $('espCarte' + k).innerHTML = ok ? DINOS[k].espece : 'à gagner';
  }
}

var messageAccueil = '';
function choisirDino(n) {
  if (!debloque(n)) { messageAccueil = 'Gagne un combat pour débloquer ce dino !'; majAccueil(); return; }
  choix[etapeChoix] = n;
  majAccueil();
}

function majAccueil() {
  var cartes = document.querySelectorAll('.carte');
  for (var i = 0; i < cartes.length; i++) cartes[i].className = 'carte' + (choix[etapeChoix] === i ? ' choisi' : '') + (debloque(i) ? '' : ' verrou');
  var opts = $('accueil').querySelectorAll('.opt');
  for (var o = 0; o < opts.length; o++) {
    var b = opts[o], on = b.getAttribute('data-joueurs') ? parseInt(b.getAttribute('data-joueurs'), 10) === reglages.joueurs
                                                     : parseInt(b.getAttribute('data-niv'), 10) === reglages.niv;
    b.className = 'opt' + (on ? ' choisi' : '');
  }
  if (reglages.joueurs === 2) $('soustitre').innerHTML = etapeChoix === 0 ? 'Joueur 1 : choisis ton dinosaure !' : 'Joueur 2 : choisis ton dinosaure !';
  else $('soustitre').innerHTML = 'Choisis ton dinosaure !';
  if (messageAccueil) { $('soustitre').innerHTML = messageAccueil; messageAccueil = ''; }
  var info = NIVEAUX[reglages.niv].info, reste = POUR_MONTER - gagnesNiveau(reglages.niv);
  if (NIVEAUX[reglages.niv + 1] && reste > 0) {
    info += '<br><span class="monte">Encore ' + reste + ' victoire' + (reste > 1 ? 's' : '') +
            ' pour passer au niveau ' + NIVEAUX[reglages.niv + 1].nom + ' !</span>';
  }
  $('infoNiveau').innerHTML = info;
  $('btnJouer').innerHTML = (reglages.joueurs === 2 && etapeChoix === 0) ? 'Suivant' : 'Combattre !';
  var v = parseInt(lire('victoires') || '0', 10);
  $('victoires').innerHTML = (v > 0 ? 'Victoires : ' + v + '<br>' : '') + 'Dinos : ' + nbDebloques() + ' / ' + DINOS.length;
}

/* Prochain dino débloqué après n (pour le joueur 2). */
function suivantDebloque(n) {
  do { n = (n + 1) % DINOS.length; } while (!debloque(n));
  return n;
}

function jouer() {
  if (reglages.joueurs === 2 && etapeChoix === 0) {
    etapeChoix = 1;
    if (choix[1] === null || choix[1] === choix[0] || !debloque(choix[1])) choix[1] = suivantDebloque(choix[0]);
    majAccueil();
    return;
  }
  if (!debloque(choix[0])) choix[0] = 0;
  var adv = choix[1];
  if (reglages.joueurs === 1) {   // l'ordi peut prendre n'importe quel dino, même un pas encore gagné
    do { adv = Math.floor(Math.random() * DINOS.length); } while (adv === choix[0]);
  }
  j = [creer(DINOS[choix[0]], false, reglages.joueurs === 2 ? 'Joueur 1' : 'Toi'),
       creer(DINOS[adv], reglages.joueurs === 1, reglages.joueurs === 2 ? 'Joueur 2' : 'Ordi')];
  etapeChoix = 0;
  tour = 0;
  afficher('combat');
  $('nomG').innerHTML = j[0].d.nom + ' <small>(' + j[0].qui + ')</small>';
  $('nomD').innerHTML = j[1].d.nom + ' <small>(' + j[1].qui + ')</small>';
  dessinerDino($('canG'), j[0].d, false);
  dessinerDino($('canD'), j[1].d, true);
  majVies();
  debutTour();
}

function creer(d, ordi, qui) { var pv = NIVEAUX[reglages.niv].pv; return { d: d, pv: pv, max: pv, vals: [], ordi: ordi, qui: qui, superFait: false, potions: POTIONS, soin: 0 }; }

/* ---------- Combat ---------- */
function majVies() {
  for (var i = 0; i < 2; i++) {
    var s = i === 0 ? 'G' : 'D', p = j[i];
    var pc = Math.round(p.pv / p.max * 100);
    $('vie' + s).style.width = pc + '%';
    $('vie' + s).style.background = pc > 50 ? '#3cc23c' : (pc > 20 ? '#f2b705' : '#e01b1b');
    $('pv' + s).innerHTML = p.pv + ' PV';
    $('cote' + s).className = 'cote' + (tour === i ? ' actif' : '');
  }
}

function bulle(h) { $('bulle').innerHTML = h; }

function debutTour() {
  occupe = false;
  majVies();
  var a = j[tour], cible = j[1 - tour];
  $('calcul').style.display = 'none';
  $('attaques').style.display = 'none';
  for (var v = 0; v < a.d.attaques.length; v++) a.vals[v] = degats(a.d.attaques[v].pts, cible);
  a.soin = soin(a);
  if (a.ordi) {
    bulle('<b>' + a.d.nom + '</b> prépare une attaque...');
    setTimeout(tourOrdi, 1300);
    return;
  }
  bulle('Il reste <b>' + cible.pv + ' PV</b> à ' + cible.d.nom + '.');
  $('titreAttaques').innerHTML = (reglages.joueurs === 2 ? a.qui + ' : ' : '') + 'à toi, ' + a.d.nom + ' ! Choisis une attaque :';
  var h = '<div id="grilleAtt">';
  for (var i = 0; i < a.d.attaques.length; i++) {
    var at = a.d.attaques[i], util = at.sup && a.superFait;
    h += '<button class="att' + (at.sup ? ' super' : '') + (util ? ' utilise' : '') + '" data-i="' + i + '">' + at.nom +
         '<span class="pts">' + (util ? 'déjà utilisée' : a.vals[i] + ' points' + (at.sup ? ' (1 seule fois)' : '')) + '</span></button>';
  }
  h += '</div>';
  var txtPotion = !a.potions ? 'plus de potion' : (!a.soin ? 'vie pleine' : '+' + a.soin + ' PV');
  h += '<button class="att potion' + (a.potions && a.soin ? '' : ' utilise') + '" id="btnPotion">' +
       '<canvas id="canPotion" width="160" height="200"></canvas>Potion<span class="pts">' + txtPotion + '</span>' +
       '<span class="pts">(' + a.potions + ' sur ' + POTIONS + ')</span></button>';
  $('listeAttaques').innerHTML = h;
  dessinerPotion($('canPotion'));
  var bs = $('grilleAtt').getElementsByTagName('button');
  for (var b = 0; b < bs.length; b++) bs[b].onclick = function () { choisirAttaque(parseInt(this.getAttribute('data-i'), 10)); };
  $('btnPotion').onclick = choisirPotion;
  $('attaques').style.display = 'block';
}

function choisirPotion() {
  if (occupe) return;
  var a = j[tour];
  if (!a.potions || !a.soin) return;
  q = { potion: true, op: '+', a: a.pv, b: a.soin, rep: a.pv + a.soin, essais: 0 };
  bulle('<b>Potion</b> : +' + a.soin + ' PV !<br>' + a.d.nom + ' a ' + a.pv + ' PV.<br>Combien en aura-t-il ?');
  $('attaques').style.display = 'none';
  $('calcul').style.display = 'block';
  ouvrirCalcul();
}

/* Le dino qui joue boit sa potion : sa barre de vie remonte. */
function soigner(pts, ensuite) {
  occupe = true;
  var a = j[tour], s = tour === 0 ? 'G' : 'D';
  a.potions--;
  son([392, 523, 659, 784], 0.1);
  a.pv = Math.min(a.max, a.pv + pts);
  majVies();
  var dg = $('degat' + s);
  dg.innerHTML = '+' + pts; dg.className = 'degat soin'; dg.style.display = 'block';
  setTimeout(function () { dg.style.display = 'none'; dg.className = 'degat'; ensuite(); }, 1300);
}

function choisirAttaque(i) {
  if (occupe) return;
  var a = j[tour], at = a.d.attaques[i];
  if (at.sup && a.superFait) return;
  var cible = j[1 - tour];
  var force = a.vals[i], pts = Math.min(force, cible.pv);
  q = { at: at, op: '−', a: cible.pv, b: pts, rep: cible.pv - pts, essais: 0 };
  var txt = '<b>' + at.nom + '</b> : ' + force + ' points !<br>';
  if (pts < force) txt += 'Il ne reste que ' + cible.pv + ' PV à ' + cible.d.nom + '.<br>';
  txt += 'Combien restera-t-il de PV à ' + cible.d.nom + ' ?';
  bulle(txt);
  $('attaques').style.display = 'none';
  $('calcul').style.display = 'block';
  ouvrirCalcul();
}

function tourOrdi() {
  var a = j[tour], cible = j[1 - tour];
  if (a.potions && a.soin && a.pv < a.max * 0.4 && Math.random() < 0.6) {
    var avantSoin = a.pv;
    bulle('<b>' + a.d.nom + '</b> boit une <b>potion</b> !<br>' + avantSoin + ' + ' + a.soin + ' = ' + (avantSoin + a.soin) +
          '<br>Il a maintenant <b>' + (avantSoin + a.soin) + ' PV</b>.');
    soigner(a.soin, function () { setTimeout(finTour, 1500); });
    return;
  }
  var possibles = [];
  for (var i = 0; i < a.d.attaques.length; i++) {
    var at = a.d.attaques[i];
    if (at.sup && a.superFait) continue;
    if (at.sup && cible.pv > cible.max * 0.6) continue; // garde la super attaque pour plus tard
    possibles.push(i);
  }
  var n = possibles[Math.floor(Math.random() * possibles.length)], choisie = a.d.attaques[n];
  if (choisie.sup) a.superFait = true;
  var pts = Math.min(a.vals[n], cible.pv), avant = cible.pv;
  bulle('<b>' + a.d.nom + '</b> utilise <b>' + choisie.nom + '</b> !<br>' + avant + ' − ' + pts + ' = ' + (avant - pts) +
        '<br>Il te reste <b>' + (avant - pts) + ' PV</b>.');
  frapper(pts, function () { setTimeout(finTour, 1700); });
}

function frapper(pts, ensuite) {
  occupe = true;
  var att = tour === 0 ? 'G' : 'D', def = tour === 0 ? 'D' : 'G';
  var cible = j[1 - tour];
  var el = $('dino' + att);
  var dx = tour === 0 ? 90 : -90;
  el.style.webkitTransform = 'translateX(' + dx + 'px)'; el.style.transform = 'translateX(' + dx + 'px)';
  setTimeout(function () {
    el.style.webkitTransform = ''; el.style.transform = '';
    sonCoup();
    cible.pv -= pts;
    majVies();
    var dg = $('degat' + def);
    dg.innerHTML = '−' + pts; dg.style.display = 'block';
    var dd = $('dino' + def), n = 0;
    var secousse = setInterval(function () {
      n++;
      var v = (n % 2 ? 12 : -12) + 'px';
      dd.style.webkitTransform = 'translateX(' + v + ')'; dd.style.transform = 'translateX(' + v + ')';
      dd.style.opacity = n % 2 ? 0.5 : 1;
      if (n >= 7) {
        clearInterval(secousse);
        dd.style.webkitTransform = ''; dd.style.transform = ''; dd.style.opacity = 1;
        setTimeout(function () { dg.style.display = 'none'; ensuite(); }, 500);
      }
    }, 90);
  }, 280);
}

function finTour() {
  var cible = j[1 - tour];
  if (cible.pv <= 0) {
    dessinerDino($(tour === 0 ? 'canD' : 'canG'), cible.d, tour === 0, true);
    setTimeout(function () { victoire(j[tour]); }, 1400);
    bulle('<b>' + cible.d.nom + '</b> est K.O. !');
    return;
  }
  tour = 1 - tour;
  debutTour();
}

function victoire(g) {
  afficher('fin');
  var humainGagne = !g.ordi;
  $('titreFin').innerHTML = humainGagne ? 'Bravo ! &#9733;' : 'Oh non !';
  if (reglages.joueurs === 2) $('texteFin').innerHTML = g.qui + ' a gagné avec ' + g.d.nom + ' ' + g.d.espece + ' !';
  else if (humainGagne) $('texteFin').innerHTML = g.d.nom + ' ' + g.d.espece + ' a gagné le combat !';
  else $('texteFin').innerHTML = g.d.nom + ' a gagné cette fois. Tu prends ta revanche ?';
  dessinerDino($('canFin'), g.d, false);
  var bonus = '';
  if (humainGagne) {
    sonBravo(); setTimeout(sonBravo, 450);
    if (reglages.joueurs === 1) {
      stocker('victoires', parseInt(lire('victoires') || '0', 10) + 1);
      var nouveau = gagnerDino(DINOS.indexOf(j[1].d));
      if (nouveau) {
        bonus = 'Nouveau dino gagné : ' + nouveau.nom + ' ' + nouveau.espece + ' !';
        dessinerDino($('canFin'), nouveau, false);
        dessinerCartes();
      }
      var n = gagnesNiveau(reglages.niv) + 1;
      stocker('gagnes-' + reglages.niv, n);
      if (n === POUR_MONTER && NIVEAUX[reglages.niv + 1]) {
        reglages.niv++;
        stocker('niv', reglages.niv);
        bonus += (bonus ? '<br>' : '') + 'Super ! Tu passes au niveau ' + NIVEAUX[reglages.niv].nom + ' !';
      }
    }
  }
  $('bonusFin').innerHTML = bonus;
}

/* ---------- Calcul : poser la soustraction ou réponse directe ---------- */
var saisie = [];   // chiffres saisis (mode posé), de gauche à droite
var sel = 0;
var directe = '';

/* Nombre de colonnes de l'opération posée (une addition peut avoir un chiffre de plus). */
function largeur() { return Math.max(chiffres(q.a).length, chiffres(q.b).length, chiffres(q.rep).length); }

function ouvrirCalcul() {
  var n = largeur();
  saisie = []; for (var i = 0; i < n; i++) saisie.push('');
  sel = n - 1;
  directe = '';
  $('aide').innerHTML = '';
  montrerMode();
}

function montrerMode() {
  if (!q) return;
  $('ongletPose').innerHTML = q.op === '+' ? 'Poser l\'addition' : 'Poser la soustraction';
  $('ongletPose').className = 'onglet' + (modeCalcul === 'pose' ? ' choisi' : '');
  $('ongletDirect').className = 'onglet' + (modeCalcul === 'direct' ? ' choisi' : '');
  $('pose').style.display = modeCalcul === 'pose' ? 'block' : 'none';
  $('direct').style.display = modeCalcul === 'direct' ? 'block' : 'none';
  if (modeCalcul === 'pose') dessinerPose(); else dessinerDirect();
}

function dessinerDirect() {
  $('opDirecte').innerHTML = q.a + ' ' + q.op + ' ' + q.b;
  $('reponseDirecte').innerHTML = directe || '?';
}

function dessinerPose(fautes) {
  if (!q) return;
  var ha = chiffres(q.a), hb = chiffres(q.b), n = largeur(), add = q.op === '+';
  while (ha.length < n) ha.unshift('');
  while (hb.length < n) hb.unshift('');
  var ancienRet = q.ret || {};
  var h = '';
  // retenues du haut
  h += '<div class="ligne ret"><span class="case"></span>';
  for (var i = 0; i < n; i++) h += '<span class="case"><span class="petite' + (ancienRet['h' + i] ? ' pleine' : '') + '" data-r="h' + i + '">' + (ancienRet['h' + i] ? '1' : '') + '</span></span>';
  h += '</div><div class="ligne"><span class="case"></span>';
  for (i = 0; i < n; i++) h += '<span class="case">' + ha[i] + '</span>';
  h += '</div><div class="ligne"><span class="case signe">' + q.op + '</span>';
  for (i = 0; i < n; i++) h += '<span class="case">' + hb[i] + '</span>';
  h += '</div>';
  if (!add) {   // soustraction : la retenue "+1" s'écrit sous le chiffre du bas
    h += '<div class="ligne ret"><span class="case"></span>';
    for (i = 0; i < n; i++) h += '<span class="case"><span class="petite' + (ancienRet['b' + i] ? ' pleine' : '') + '" data-r="b' + i + '">' + (ancienRet['b' + i] ? '+1' : '') + '</span></span>';
    h += '</div>';
  }
  h += '<div class="trait" style="width:' + ((n + 1) * 64) + 'px"></div><div class="ligne"><span class="case"></span>';
  for (i = 0; i < n; i++) {
    h += '<span class="case rep' + (i === sel ? ' sel' : '') + (fautes && fautes[i] ? ' faux' : '') + '" data-c="' + i + '">' + saisie[i] + '</span>';
  }
  h += '</div>';
  $('pose').innerHTML = h;
  var reps = $('pose').querySelectorAll('.rep');
  for (var r = 0; r < reps.length; r++) reps[r].onclick = function () { sel = parseInt(this.getAttribute('data-c'), 10); dessinerPose(); };
  var pets = $('pose').querySelectorAll('.petite');
  for (var p = 0; p < pets.length; p++) pets[p].onclick = function () {
    if (!q || occupe) return;
    q.ret = q.ret || {};
    var k = this.getAttribute('data-r');
    q.ret[k] = !q.ret[k];
    dessinerPose();
  };
}

function construirePave() {
  var t = ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'eff', '0', 'ok'], h = '';
  for (var i = 0; i < t.length; i++) {
    var lib = t[i] === 'eff' ? 'Effacer' : (t[i] === 'ok' ? 'Valider' : t[i]);
    h += '<button class="touche' + (t[i] === 'eff' ? ' eff' : '') + (t[i] === 'ok' ? ' ok' : '') + '" data-t="' + t[i] + '">' + lib + '</button>';
  }
  $('pave').innerHTML = h;
  var bs = $('pave').getElementsByTagName('button');
  for (var b = 0; b < bs.length; b++) bs[b].onclick = function () { touche(this.getAttribute('data-t')); };
  $('ongletPose').onclick = function () { modeCalcul = 'pose'; stocker('mode', 'pose'); montrerMode(); };
  $('ongletDirect').onclick = function () { modeCalcul = 'direct'; stocker('mode', 'direct'); montrerMode(); };
}

function touche(t) {
  if (occupe || !q) return;
  if (t === 'ok') { valider(); return; }
  if (modeCalcul === 'direct') {
    if (t === 'eff') directe = directe.slice(0, -1);
    else if (directe.length < 4) directe = (directe === '0' ? '' : directe) + t;
    dessinerDirect();
    return;
  }
  if (t === 'eff') {
    if (saisie[sel] === '' && sel < saisie.length - 1) sel++;
    saisie[sel] = '';
  } else {
    saisie[sel] = t;
    if (sel > 0) sel--;   // on écrit de droite à gauche, comme sur le cahier
  }
  dessinerPose();
}

function lireReponse() {
  if (modeCalcul === 'direct') return directe === '' ? null : parseInt(directe, 10);
  var debut = true, txt = '';
  for (var i = 0; i < saisie.length; i++) {
    if (saisie[i] === '') { if (!debut) return 'trou'; continue; }
    debut = false; txt += saisie[i];
  }
  return txt === '' ? null : parseInt(txt, 10);
}

function valider() {
  var r = lireReponse();
  if (r === null) { $('aide').innerHTML = 'Écris ta réponse avec les chiffres.'; return; }
  if (r === 'trou') { $('aide').innerHTML = 'Il manque un chiffre au milieu !'; return; }
  var a = j[tour], cible = j[1 - tour], calc = q.a + ' ' + q.op + ' ' + q.b + ' = ' + q.rep;
  if (r === q.rep) {
    sonBravo();
    $('aide').innerHTML = '<span style="color:#1c7a1c">Bravo ! ' + calc + '</span>';
    var pts = q.b;
    if (q.potion) {
      bulle('Glou glou ! <b>' + a.d.nom + '</b> a maintenant <b>' + q.rep + ' PV</b>.');
      q = null;
      setTimeout(function () { soigner(pts, function () { setTimeout(finTour, 500); }); }, 500);
      return;
    }
    if (q.at.sup) a.superFait = true;
    bulle('Bravo ! <b>' + q.at.nom + '</b> !<br>Il reste <b>' + q.rep + ' PV</b> à ' + cible.d.nom + '.');
    q = null;
    setTimeout(function () { frapper(pts, function () { setTimeout(finTour, 700); }); }, 500);
    return;
  }
  q.essais++;
  sonFaux();
  var nomOp = q.potion ? 'l\'addition' : 'la soustraction';
  if (q.essais === 1) {
    $('aide').innerHTML = '<span style="color:#e01b1b">Pas tout à fait... Vérifie ton calcul !</span>';
  } else if (q.essais === 2) {
    if (modeCalcul === 'pose') {
      var bon = chiffres(q.rep), n = saisie.length, fautes = [];
      while (bon.length < n) bon.unshift('');
      for (var i = 0; i < n; i++) {
        var v = saisie[i] === '' ? '' : saisie[i];
        var attendu = bon[i];
        fautes.push(!(v === attendu || (attendu === '' && (v === '' || v === '0'))));
      }
      dessinerPose(fautes);
      $('aide').innerHTML = '<span style="color:#e01b1b">Les cases rouges sont fausses. Dernier essai !</span>';
    } else {
      $('aide').innerHTML = '<span style="color:#e01b1b">Encore raté. Essaie de poser ' + nomOp + ' ! Dernier essai.</span>';
    }
  } else {
    occupe = true;
    $('aide').innerHTML = 'La bonne réponse était <b>' + calc + '</b>';
    if (q.potion) {
      a.potions--;
      bulle('Oh non, la potion s\'est renversée !');
    } else {
      bulle('Oh non, l\'attaque <b>' + q.at.nom + '</b> a raté !');
      if (q.at.sup) a.superFait = true;
    }
    q = null;
    setTimeout(function () { tour = 1 - tour; debutTour(); }, 3200);
  }
}

/* ---------- Menu ---------- */
function dessinerOeuf(canvas, casse) {
  var c = canvas.getContext('2d'), k = canvas.width / 64;
  c.setTransform(k, 0, 0, k, 0, 0);
  c.clearRect(0, 0, 64, 80);
  c.lineJoin = 'round';
  c.fillStyle = 'rgba(0,0,0,0.15)'; ell(c, 32, 76, 24, 4); c.fill();
  if (casse) {   // il ne reste que la coquille cassée
    poly(c, [6, 74, 8, 52, 18, 60, 26, 48, 34, 60, 44, 48, 50, 60, 58, 52, 58, 74]); remplir(c, '#fff4d6');
    return;
  }
  ell(c, 32, 44, 26, 32); remplir(c, '#fff4d6');
  c.fillStyle = '#7cc35a';
  c.beginPath(); c.arc(22, 32, 6, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(40, 52, 7, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(38, 24, 4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(20, 58, 4, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.8)'; ell(c, 20, 22, 5, 9); c.fill();
}

/* Dessine un dino (repère 240 x 180) dans un rectangle d'un grand canvas. */
function dinoDans(canvas, d, x, y, w, versGauche) {
  var tmp = document.createElement('canvas');
  tmp.width = 480; tmp.height = 360;
  dessinerDino(tmp, d, versGauche);
  var c = canvas.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(tmp, x, y, w, w * 0.75);
}

function dessinerMenu() {
  var a = $('canMenuCombat'), b = $('canMenuChrono');
  a.getContext('2d').clearRect(0, 0, a.width, a.height);
  dinoDans(a, DINOS[0], 0, 20, 400, false);
  dinoDans(a, DINOS[1], 320, 20, 400, true);
  b.getContext('2d').clearRect(0, 0, b.width, b.height);
  dinoDans(b, DINOS[0], 20, 30, 400, false);
  var o = document.createElement('canvas'); o.width = 128; o.height = 160;
  dessinerOeuf(o);
  b.getContext('2d').drawImage(o, 560, 140, 128, 160);
}

/* ================= Calcul chrono (format de l'examen) ================= */
/* Une fiche de 15 additions et soustractions, à finir avant la fin du temps.
   Rien n'est corrigé pendant l'épreuve : la correction arrive à la fin. */
var NB_CALCULS = 15;
var CHRONO_NIV = [
  'des calculs jusqu\'à 10 (comme 6 + 3, 9 − 4)',
  'des calculs jusqu\'à 20 (comme 8 + 7, 15 − 6)',
  'des nombres jusqu\'à 100 sans retenue (comme 43 + 25)',
  'des nombres jusqu\'à 100 avec retenues (comme 47 + 38, 72 − 29)',
  'des nombres à 3 chiffres (comme 345 + 278)'
];
var TEMPS = [300, 240, 180, 120];
var cr = { niv: parseInt(lire('c-niv') || '1', 10), temps: parseInt(lire('c-temps') || '180', 10) };
if (!CHRONO_NIV[cr.niv]) cr.niv = 1;
if (TEMPS.indexOf(cr.temps) < 0) cr.temps = 180;

var course = null;   // fiche en cours
var minuteur = null;

function enMinutes(s) {
  s = Math.max(0, Math.ceil(s));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function enMots(s) {
  s = Math.round(s);
  var m = Math.floor(s / 60), r = s % 60, t = '';
  if (m) t = m + ' min';
  if (r || !m) t += (t ? ' ' : '') + r + ' s';
  return t;
}
function cleRecord() { return 'c-rec-' + cr.niv + '-' + cr.temps; }

/* Un calcul au hasard, selon le niveau. */
function unCalcul(signe) {
  var a, b, n = cr.niv, plus = signe === '+';
  if (n === 0) {
    if (plus) { a = hasard(1, 9); b = hasard(1, 10 - a); }
    else { a = hasard(3, 10); b = hasard(1, a - 1); }
  } else if (n === 1) {
    if (plus) { a = hasard(3, 15); b = hasard(2, 20 - a); }
    else { a = hasard(11, 20); b = hasard(2, a - 1); }
  } else if (n === 2) {   // sans retenue : chiffre par chiffre
    var u1 = hasard(0, 9), d1 = hasard(1, 8), u2, d2;
    if (plus) { u2 = hasard(0, 9 - u1); d2 = hasard(1, 9 - d1); }
    else { d1 = hasard(2, 9); u2 = hasard(0, u1); d2 = hasard(1, d1 - 1); }
    a = d1 * 10 + u1; b = d2 * 10 + u2;
  } else if (n === 3) {   // avec retenue sur les unités
    if (plus) {
      do { a = hasard(12, 79); b = hasard(11, 99 - a); } while ((a % 10) + (b % 10) < 10);
    } else {
      do { a = hasard(30, 99); b = hasard(11, a - 5); } while ((a % 10) >= (b % 10));
    }
  } else {
    if (plus) { a = hasard(101, 799); b = hasard(101, 999 - a); }
    else { a = hasard(300, 999); b = hasard(101, a - 50); }
  }
  return { a: a, b: b, op: plus ? '+' : '−', rep: plus ? a + b : a - b };
}

/* 15 calculs : 8 additions et 7 soustractions, mélangées, sans doublon. */
function preparerCalculs() {
  var signes = [], liste = [], vus = {}, i;
  for (i = 0; i < NB_CALCULS; i++) signes.push(i < 8 ? '+' : '-');
  for (i = signes.length - 1; i > 0; i--) { var k = hasard(0, i), t = signes[i]; signes[i] = signes[k]; signes[k] = t; }
  for (i = 0; i < NB_CALCULS; i++) {
    var c, cle, essai = 0;
    do { c = unCalcul(signes[i]); cle = c.a + c.op + c.b; essai++; } while (vus[cle] && essai < 30);
    vus[cle] = true;
    liste.push(c);
  }
  return liste;
}

/* La fiche : 2 colonnes (1 à 8, puis 9 à 15), comme une feuille d'exercices. */
function htmlFiche(calculs, saisies, corrige, sel) {
  var h = '';
  for (var i = 0; i < calculs.length; i++) {
    var c = calculs[i], s = saisies[i], col = i < 8 ? 0 : 1, lig = i < 8 ? i : i - 8;
    var cls = 'boite', apres = '';
    if (corrige) {
      if (s === '') { cls += ' vide'; apres = '<span class="corr">' + c.rep + '</span>'; }
      else if (parseInt(s, 10) === c.rep) { cls += ' juste'; apres = '<span class="corr">&#10004;</span>'; }
      else { cls += ' faux'; apres = '<span class="corr">' + c.rep + '</span>'; }
    }
    h += '<div class="item' + (!corrige && i === sel ? ' sel' : '') + '" data-i="' + i + '" style="left:' + (8 + col * 316) + 'px;top:' + (12 + lig * 51) + 'px">' +
         '<span class="num">' + (i + 1) + '.</span><span class="calc">' + c.a + ' ' + c.op + ' ' + c.b + ' =</span>' +
         '<span class="' + cls + '">' + s + '</span>' + apres + '</div>';
  }
  return h;
}

/* --- Écran des réglages --- */
function ouvrirReglagesChrono() {
  afficher('chronoReglages');
  majReglagesChrono();
}

function majReglagesChrono() {
  var opts = $('chronoReglages').querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i], on = b.getAttribute('data-cniv') ? parseInt(b.getAttribute('data-cniv'), 10) === cr.niv
                                                    : parseInt(b.getAttribute('data-ctps'), 10) === cr.temps;
    b.className = 'opt' + (on ? ' choisi' : '');
  }
  var h = '<b>15 calculs</b> avec ' + CHRONO_NIV[cr.niv] + '.<br>Le dino attrape l\'œuf en <b>' + enMots(cr.temps) + '</b>.';
  var rec = lireRecord();
  if (rec) h += '<br>Ton record : <b>' + rec.score + ' / 15</b> en ' + enMots(rec.temps);
  $('infoChrono').innerHTML = h;
}

function lireRecord() {
  var r = lire(cleRecord());
  if (!r) return null;
  var p = r.split('|');
  return { score: parseInt(p[0], 10), temps: parseFloat(p[1]) };
}

function construireChrono() {
  var opts = $('chronoReglages').querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].onclick = function () {
      if (this.getAttribute('data-cniv')) { cr.niv = parseInt(this.getAttribute('data-cniv'), 10); stocker('c-niv', cr.niv); }
      else { cr.temps = parseInt(this.getAttribute('data-ctps'), 10); stocker('c-temps', cr.temps); }
      majReglagesChrono();
    };
  }
  var t = ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'eff', '0', 'ok'], h = '';
  for (var k = 0; k < t.length; k++) {
    var lib = t[k] === 'eff' ? 'Effacer' : (t[k] === 'ok' ? 'Suivant' : t[k]);
    h += '<button class="touche' + (t[k] === 'eff' ? ' eff' : '') + (t[k] === 'ok' ? ' ok' : '') + '" data-t="' + t[k] + '">' + lib + '</button>';
  }
  $('paveChrono').innerHTML = h;
  var bs = $('paveChrono').getElementsByTagName('button');
  for (var n = 0; n < bs.length; n++) bs[n].onclick = function () { toucheChrono(this.getAttribute('data-t')); };
  $('fiche').onclick = function (ev) {
    var el = (ev || window.event).target || (ev || window.event).srcElement;
    while (el && el !== this && !(el.className && String(el.className).indexOf('item') === 0)) el = el.parentNode;
    if (!el || el === this || !course || course.fini) return;
    course.sel = parseInt(el.getAttribute('data-i'), 10);
    majFiche();
  };
  $('btnFini').onclick = appuiFini;
  $('btnPartir').onclick = partirChrono;
  $('regMenu').onclick = allerMenu;
  $('btnStop').onclick = function () { arreterMinuteur(); course = null; ouvrirReglagesChrono(); };
  $('btnChronoRejouer').onclick = partirChrono;
  $('btnChronoReglages').onclick = ouvrirReglagesChrono;
  $('btnChronoMenu').onclick = allerMenu;
}

/* --- L'épreuve --- */
function partirChrono() {
  var dispo = [];
  for (var i = 0; i < DINOS.length; i++) if (debloque(i)) dispo.push(i);
  var d = DINOS[dispo[Math.floor(Math.random() * dispo.length)]];
  var saisies = [];
  for (var k = 0; k < NB_CALCULS; k++) saisies.push('');
  course = { d: d, calculs: preparerCalculs(), saisies: saisies, sel: 0, duree: cr.temps,
             debut: new Date().getTime(), fini: false, pas: 0, confirmer: 0 };
  dessinerDino($('canChasseur'), d, false);
  dessinerOeuf($('canOeuf'));
  $('btnFini').innerHTML = 'J\'ai fini !';
  afficher('chrono');
  majFiche();
  majCourse();
  arreterMinuteur();
  minuteur = setInterval(majCourse, 100);
}

function arreterMinuteur() { if (minuteur) { clearInterval(minuteur); minuteur = null; } }
function ecoule() { return (new Date().getTime() - course.debut) / 1000; }
function nbRemplis() { var n = 0; for (var i = 0; i < NB_CALCULS; i++) if (course.saisies[i] !== '') n++; return n; }

function majFiche() {
  $('fiche').innerHTML = htmlFiche(course.calculs, course.saisies, false, course.sel);
  var n = nbRemplis();
  $('compteur').innerHTML = n + ' calcul' + (n > 1 ? 's' : '') + ' fait' + (n > 1 ? 's' : '') + ' sur 15';
}

function majCourse() {
  if (!course || course.fini) return;
  var t = ecoule(), p = Math.min(1, t / course.duree), reste = course.duree - t;
  course.pas++;
  var saut = (course.pas >> 1) % 2 ? -6 : 0;   // le dino court en sautillant
  var st = $('chasseur').style;
  st.left = Math.round(p * 774) + 'px';
  st.webkitTransform = 'translateY(' + saut + 'px)'; st.transform = 'translateY(' + saut + 'px)';
  $('temps').innerHTML = enMinutes(reste);
  $('temps').className = reste <= 15 ? 'urgent' : '';
  var oe = $('oeuf').style, tr = '';
  if (p > 0.85) tr = 'rotate(' + ((course.pas % 2) ? 8 : -8) + 'deg)';   // l'œuf tremble quand le dino approche
  oe.webkitTransform = tr; oe.transform = tr;
  if (course.confirmer && new Date().getTime() > course.confirmer) { course.confirmer = 0; $('btnFini').innerHTML = 'J\'ai fini !'; }
  if (p >= 1) tempsEcoule();
}

/* Passe à la case suivante (de préférence une case vide). */
function caseSuivante() {
  for (var k = 1; k <= NB_CALCULS; k++) {
    var i = (course.sel + k) % NB_CALCULS;
    if (course.saisies[i] === '') { course.sel = i; return; }
  }
  course.sel = (course.sel + 1) % NB_CALCULS;
}

function toucheChrono(t) {
  if (!course || course.fini) return;
  var s = course.saisies[course.sel];
  if (t === 'ok') caseSuivante();
  else if (t === 'eff') course.saisies[course.sel] = s.slice(0, -1);
  else if (s.length < 4) course.saisies[course.sel] = (s === '0' ? '' : s) + t;
  majFiche();
}

function appuiFini() {
  if (!course || course.fini) return;
  var vides = NB_CALCULS - nbRemplis();
  if (vides > 0 && !course.confirmer) {   // un 2e appui confirme
    $('btnFini').innerHTML = vides + ' vide' + (vides > 1 ? 's' : '') + ' : sûr ?';
    course.confirmer = new Date().getTime() + 3000;
    return;
  }
  terminerChrono(false);
}

function tempsEcoule() {
  course.fini = true;
  arreterMinuteur();
  $('temps').innerHTML = '0:00';
  dessinerOeuf($('canOeuf'), true);
  $('compteur').innerHTML = 'Temps écoulé ! ' + course.d.nom + ' a attrapé l\'œuf !';
  son([392, 330, 262], 0.2);
  setTimeout(function () { terminerChrono(true); }, 1800);
}

function terminerChrono(horsTemps) {
  course.fini = true;
  arreterMinuteur();
  var temps = horsTemps ? course.duree : ecoule(), juste = 0;
  for (var i = 0; i < NB_CALCULS; i++) if (course.saisies[i] !== '' && parseInt(course.saisies[i], 10) === course.calculs[i].rep) juste++;
  $('ficheCorrigee').innerHTML = htmlFiche(course.calculs, course.saisies, true, -1);
  $('scoreFin').innerHTML = juste + ' <small>/ 15</small>';
  var etoiles = juste === 15 ? 3 : juste >= 12 ? 2 : juste >= 8 ? 1 : 0, e = '';
  for (var k = 0; k < 3; k++) e += k < etoiles ? '&#9733;' : '&#9734;';
  $('etoilesFin').innerHTML = e;
  if (horsTemps) {
    $('titreChronoFin').innerHTML = 'Temps écoulé !';
    $('sousTitreFin').innerHTML = course.d.nom + ' a attrapé l\'œuf. Voici la correction :';
  } else {
    $('titreChronoFin').innerHTML = juste === 15 ? 'Bravo, tout est juste !' : 'Fini à temps !';
    $('sousTitreFin').innerHTML = 'L\'œuf est sauvé, avec ' + enMots(course.duree - temps) + ' d\'avance. Voici la correction :';
  }
  $('texteChronoFin').innerHTML = juste === 15 ? 'Zéro faute !' : (juste >= 12 ? 'Très bien !' : (juste >= 8 ? 'Bien, continue !' : 'Courage, on recommence !'));
  if (horsTemps) $('texteChronoFin').innerHTML += '<br>' + nbRemplis() + ' calcul' + (nbRemplis() > 1 ? 's' : '') + ' fait' + (nbRemplis() > 1 ? 's' : '') + ' en ' + enMots(course.duree) + '.';
  else $('texteChronoFin').innerHTML += '<br>Fini en ' + enMots(temps) + '.';
  var rec = lireRecord(), txt = '';
  if (!rec || juste > rec.score || (juste === rec.score && temps < rec.temps)) {
    if (juste > 0) {
      txt = rec ? 'Nouveau record !' : 'Premier record !';
      stocker(cleRecord(), juste + '|' + temps.toFixed(1));
    }
  } else txt = 'Record : ' + rec.score + ' / 15 en ' + enMots(rec.temps);
  $('recordFin').innerHTML = txt;
  if (juste >= 12) { sonBravo(); setTimeout(sonBravo, 450); }
  afficher('chronoFin');
}

/* Clavier (pour jouer sur un ordinateur) */
document.onkeydown = function (ev) {
  ev = ev || window.event;
  var k = ev.keyCode;
  var t = (k >= 48 && k <= 57) ? String(k - 48) : (k >= 96 && k <= 105) ? String(k - 96) : k === 13 ? 'ok' : k === 8 ? 'eff' : null;
  if (!t) return;
  if ($('chrono').style.display === 'block') { toucheChrono(t); return false; }
  if ($('combat').style.display === 'block' && $('calcul').style.display === 'block') { touche(t); return false; }
};

/* ---------- Démarrage ---------- */
function allerMenu() { arreterMinuteur(); course = null; afficher('menu'); }
$('btnRejouer').onclick = function () { afficher('accueil'); majAccueil(); };
$('btnFinMenu').onclick = allerMenu;
$('accMenu').onclick = allerMenu;
$('jeuCombat').onclick = function () { etapeChoix = 0; afficher('accueil'); majAccueil(); };
$('jeuChrono').onclick = ouvrirReglagesChrono;
construireAccueil();
construirePave();
construireChrono();
majAccueil();
dessinerMenu();
afficher('menu');
ajuster();
